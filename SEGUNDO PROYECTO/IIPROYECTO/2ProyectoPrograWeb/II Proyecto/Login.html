<!DOCTYPE html>
<html lang="es">
<!-- "@nDr3w-JeY" -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTN Perfiles — Iniciar sesión</title>
  <link rel="stylesheet" href="css/modern-app.css">
</head>
<body class="login-shell">
  <main class="card login-card">
    <div class="brand-center">
      <img src="LogoUTN.jpg" alt="Logotipo UTN">
      <h1>UTN Perfiles</h1>
      <p>Introducción a la Programación Web</p>
    </div>

    <div id="login-error" class="alert alert-error" role="alert" hidden></div>

    <form id="form-1" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" autocomplete="username" placeholder="Ej. admin" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
      </div>
      <button id="btnLogin" class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>

    <div class="alert alert-info" style="margin-top:1rem;margin-bottom:0;">
      Acceso predeterminado: <strong>admin</strong> / <strong>admin</strong> (o cualquier usuario creado en la pestaña Usuarios).
    </div>
    <p style="text-align:center;color:#475569;font-size:0.84rem;margin:1rem 0 0;">
      <strong>Derechos de autor:</strong> <em>Andrés J. Jiménez Leandro</em>
    </p>
  </main>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
