<!DOCTYPE html>
<html lang="es">
<!-- "@nDr3w-JeY" -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTN Perfiles — Tablero Principal</title>
  <link rel="stylesheet" href="css/modern-app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <img src="LogoUTN.png" alt="Logotipo UTN">
        <h1>UTN Perfiles</h1>
      </div>
      <div class="topbar-user msj">
        <span id="welcome-user">¡Hola! Invitado</span>
        <button id="btn-logout" type="button" class="btn btn-secondary btn-sm">Salir</button>
      </div>
    </div>
  </header>

  <main class="main">
    <nav class="tabs" role="tablist" aria-label="Módulos de gestión">
      <button id="tab-btn-1" class="tab-btn" role="tab" aria-selected="true" aria-controls="tab-1" data-tab="1" type="button">Tablero</button>
      <button id="tab-btn-2" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-2" data-tab="2" type="button">Carreras <span id="pill-careers" class="pill">0</span></button>
      <button id="tab-btn-3" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-3" data-tab="3" type="button">Estudiantes <span id="pill-students" class="pill">0</span></button>
      <button id="tab-btn-4" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-4" data-tab="4" type="button">Usuarios <span id="pill-users" class="pill">0</span></button>
    </nav>

    <section id="tab-1" class="card" role="tabpanel" aria-labelledby="tab-btn-1">
      <div class="kpi-grid">
        <div class="kpi"><span>Carreras</span><strong id="kpi-careers">0</strong></div>
        <div class="kpi"><span>Estudiantes</span><strong id="kpi-students">0</strong></div>
        <div class="kpi"><span>Usuarios</span><strong id="kpi-users">0</strong></div>
      </div>

      <form id="local-search-form" class="search-row" role="search">
        <input id="local-search-input" type="search" placeholder="Filtrar carreras, estudiantes o usuarios locales..." aria-label="Buscar registros locales">
        <button type="submit" class="btn btn-primary">Buscar</button>
        <button id="local-search-clear" type="button" class="btn btn-secondary">Limpiar</button>
      </form>
      <div id="local-search-results" aria-live="polite"></div>

      <h2 style="font-size:1.05rem;margin:1.2rem 0 0.5rem;">Últimas búsquedas de referencia</h2>
      <ul class="links-list">
        <li><span class="date-tag">2014/06/01</span><a href="https://angular.dev/" target="_blank" rel="noopener noreferrer">Angular / AngularJS</a></li>
        <li><span class="date-tag">2014/07/05</span><a href="https://www.mysql.com/" target="_blank" rel="noopener noreferrer">MySQL</a></li>
        <li><span class="date-tag">2014/08/10</span><a href="https://www.php.net/" target="_blank" rel="noopener noreferrer">PHP Code</a></li>
        <li><span class="date-tag">2014/08/17</span><a href="https://www.python.org/" target="_blank" rel="noopener noreferrer">Python New Paradigm</a></li>
      </ul>

      <form method="get" action="https://www.google.com/search" target="_blank" rel="noopener noreferrer" class="search-row">
        <input type="search" name="q" placeholder="Buscar en Google..." aria-label="Buscar en Google">
        <button type="submit" class="btn btn-secondary">Buscar en Google</button>
      </form>
    </section>

    <section id="tab-2" class="card" role="tabpanel" aria-labelledby="tab-btn-2" hidden>
      <div class="toolbar">
        <h2 style="margin:0;font-size:1.15rem;">Carreras</h2>
        <button id="btn-add-career" type="button" class="btn btn-primary">+ Nueva carrera</button>
      </div>
      <div id="carreras" class="table-scroll"></div>
    </section>

    <section id="tab-3" class="card" role="tabpanel" aria-labelledby="tab-btn-3" hidden>
      <div class="toolbar">
        <h2 style="margin:0;font-size:1.15rem;">Estudiantes</h2>
        <button id="btn-add-student" type="button" class="btn btn-primary">+ Nuevo estudiante</button>
      </div>
      <div id="estudiantes" class="table-scroll"></div>
    </section>

    <section id="tab-4" class="card" role="tabpanel" aria-labelledby="tab-btn-4" hidden>
      <div class="toolbar">
        <h2 style="margin:0;font-size:1.15rem;">Usuarios</h2>
        <button id="btn-add-user" type="button" class="btn btn-primary">+ Nuevo usuario</button>
      </div>
      <div id="usuarios" class="table-scroll"></div>
    </section>
  </main>

  <footer class="footer">
    <strong>Derechos de autor:</strong> <em>Andrés J. Jiménez Leandro</em>
  </footer>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Formulario</h2>
        <button id="modal-close" type="button" class="btn btn-secondary btn-sm" aria-label="Cerrar">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast-box" class="toast-box" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
